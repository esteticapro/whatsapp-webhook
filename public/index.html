<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Meu WhatsApp</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #e9fef1;
        text-align: center;
        padding: 50px;
      }
      h1 {
        color: #128c7e;
      }
      #qr {
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <h1>Conecte seu WhatsApp</h1>
    <div id="qr">
      <p>Carregando QR Code...</p>
    </div>

    <script>
      async function carregarQR() {
        try {
          const res = await fetch("/qr");
          const html = await res.text();
          document.getElementById("qr").innerHTML = html;
        } catch {
          document.getElementById("qr").innerHTML =
            "<p>❌ Erro ao carregar o QR Code.</p>";
        }
      }

      carregarQR();
      setInterval(carregarQR, 5000);
    </script>
  </body>
</html>
